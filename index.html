<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3d0715" />
  <title>Para Santi, con todo mi amor</title>
  <style>
    :root { color-scheme: dark; --cream: #fff5ed; --rose: #ffb1bd; --wine: #21040d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; overflow-x: hidden; color: var(--cream);
      background: radial-gradient(ellipse at 50% 24%, #9f1638 0%, #661027 34%, #3d0715 70%, #21040d 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E"); z-index: -1; }
    .glow { position: fixed; width: 340px; height: 340px; border-radius: 50%; filter: blur(110px); opacity: .18; background: #ff315f; top: 5%; left: -170px; pointer-events: none; }
    main { position: relative; z-index: 2; min-height: 100svh; padding: 42px 22px 30px; display: grid; place-items: center; }
    :root { --photo-width: clamp(54px, 14vw, 188px); }
    .love-trail { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
    .photo-drop { position: absolute; top: 0; width: var(--photo-width); opacity: 0; animation: photos-fall 29s linear infinite; }
    .photo-drop.left { left: max(8px, calc((100vw - 1080px) / 2)); animation-delay: -14s; }
    .photo-drop.right { right: max(8px, calc((100vw - 1080px) / 2)); animation-duration: 33s; animation-delay: -5s; }
    .photo-card { position: relative; padding: 6px 6px 22px; border: 1px solid rgba(255,245,237,.8); border-radius: 4px; background: #fff7f1; box-shadow: 0 10px 28px rgba(14,0,5,.38); transform: rotate(-4deg); }
    .photo-drop.right .photo-card { transform: rotate(4deg); }
    .photo-card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 2px; }
    .love-word { position: absolute; left: 50%; top: -17px; transform: translateX(-50%); padding: 4px 8px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; color: #fff8f2; background: linear-gradient(90deg,#e72e59,#b5123d); box-shadow: 0 4px 12px rgba(73,0,19,.28); font: 700 10px/1 system-ui,sans-serif; letter-spacing: .09em; white-space: nowrap; }
    .love-heart { position: absolute; color: #f21d49; font: 17px/1 system-ui,sans-serif; text-shadow: 0 2px 8px rgba(255,40,87,.45); animation: heartbeat 1.5s ease-in-out infinite; }
    .love-heart.one { left: -11px; top: 27%; }
    .love-heart.two { right: -12px; top: 65%; font-size: 13px; animation-delay: -.6s; }
    .love-heart.three { right: 5px; bottom: 7px; font-size: 10px; animation-delay: -.9s; }
    @keyframes photos-fall { 0% { transform: translateY(-135%); opacity: 0; } 8% { opacity: .98; } 88% { opacity: .98; } 100% { transform: translateY(calc(100svh + 140%)); opacity: 0; } }
    .letter { width: min(100%, 680px); position: relative; text-align: center; padding: clamp(34px, 7vw, 66px) clamp(22px, 7vw, 70px) 38px; border: 1px solid rgba(255,245,237,.22); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.025)); box-shadow: 0 28px 90px rgba(14,0,5,.38), inset 0 1px rgba(255,255,255,.1); backdrop-filter: blur(8px); animation: arrive 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 19px; color: #ffd5d8; font: 600 11px/1.4 system-ui,sans-serif; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(38px, 8vw, 66px); line-height: .98; font-weight: 500; letter-spacing: -.045em; }
    h1 span { display: block; color: #ffc0c8; font-style: italic; }
    .rule { display: flex; align-items: center; gap: 13px; justify-content: center; margin: 30px 0 25px; color: #ffc0c8; font-size: 14px; }
    .rule::before,.rule::after { content:''; width: 42px; height: 1px; background: rgba(255,224,226,.38); }
    .message { min-height: 104px; display: flex; align-items: center; justify-content: center; margin: 0 auto; max-width: 485px; color: #fff9f4; font-size: clamp(18px, 3.3vw, 23px); line-height: 1.7; }
    .cursor { display: inline-block; width: 1px; height: 1.12em; margin-left: 3px; vertical-align: -.17em; background: #ffc0c8; animation: blink .75s step-end infinite; }
    .counter { margin: 17px 0 30px; color: #f4cbd0; font: 11px/1.5 system-ui,sans-serif; letter-spacing: .17em; text-transform: uppercase; }
    .counter b { color: #fff8f2; font-weight: 600; }
    .duo { display: flex; align-items: center; justify-content: center; gap: clamp(15px, 5vw, 36px); }
    .heart-wrap { width: clamp(92px, 22vw, 138px); aspect-ratio: 1; display: grid; place-items: center; position: relative; }
    .heart { font-family: system-ui,sans-serif; color: #f21d49; font-size: clamp(74px, 18vw, 116px); line-height: 1; display: block; filter: drop-shadow(0 9px 24px rgba(255,20,69,.43)); animation: heartbeat 1.35s ease-in-out infinite; }
    .heart-wrap::after { content: '♥'; position: absolute; inset: 0; display: grid; place-items: center; font: 22px system-ui,sans-serif; color: rgba(255,237,235,.88); animation: sparkle 2.1s ease-in-out infinite; }
    figure { margin: 0; width: clamp(116px, 30vw, 174px); transform: rotate(3deg); }
    .meme-frame { padding: 7px 7px 22px; border: 1px solid rgba(255,255,255,.55); background: #fff8f0; box-shadow: 0 13px 33px rgba(18,0,6,.34); border-radius: 3px; }
    .meme-frame img { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; background: #dbe9dc; }
    figcaption { margin-top: -17px; position: relative; color: #5a1730; font: 10px system-ui,sans-serif; letter-spacing: .06em; }
    .credit { margin: 22px 0 0; color: rgba(255,235,232,.56); font: 10px/1.5 system-ui,sans-serif; }
    .credit a { color: inherit; text-underline-offset: 3px; }
    .ornament { position: absolute; color: #ffb5c1; opacity: .78; font: 24px system-ui,sans-serif; filter: drop-shadow(0 0 12px rgba(255,124,154,.42)); animation: heartbeat 2s ease-in-out infinite; }
    .ornament-left { left: 20px; top: 22px; transform: rotate(-16deg); }
    .ornament-right { right: 22px; top: 25px; font-size: 17px; animation-delay: -.7s; }
    .spark { position: fixed; color: #ffd1d4; opacity: 0; pointer-events: none; animation: drift 7s linear infinite; }
    .spark:nth-of-type(1) { left: 13%; top: 17%; animation-delay: -1s; }
    .spark:nth-of-type(2) { right: 12%; top: 27%; animation-delay: -4s; font-size: 12px; }
    .spark:nth-of-type(3) { right: 17%; bottom: 12%; animation-delay: -2.5s; font-size: 10px; }
    .spark:nth-of-type(4) { left: 8%; bottom: 22%; animation-delay: -3s; font-size: 18px; }
    .spark:nth-of-type(5) { right: 7%; top: 58%; animation-delay: -5s; font-size: 16px; }
    .spark:nth-of-type(6) { left: 24%; top: 8%; animation-delay: -2s; font-size: 11px; }
    .spark:nth-of-type(7) { right: 28%; bottom: 5%; animation-delay: -4.5s; font-size: 14px; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.12); } 24% { transform: scale(1); } 36% { transform: scale(1.08); } 52% { transform: scale(1); } }
    @keyframes sparkle { 0%,100% { transform: scale(.72); opacity: .42; } 50% { transform: scale(1.2); opacity: 1; } }
    @keyframes drift { 0% { transform: translateY(12px) rotate(0); opacity: 0; } 18% { opacity: .7; } 78% { opacity: .55; } 100% { transform: translateY(-38px) rotate(24deg); opacity: 0; } }
    @media (max-width: 1000px) { .letter { width: min(680px, calc(100vw - var(--photo-width) - var(--photo-width) - 64px)); padding-inline: clamp(14px, 4vw, 42px); } }
    @media (max-width: 420px) { main { padding: 28px 4px 24px; } .letter { width: min(680px, calc(100vw - var(--photo-width) - var(--photo-width) - 48px)); min-width: 0; border-radius: 22px; padding: 36px 12px 28px; } .message { min-height: 130px; font-size: 17px; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } .photo-drop { opacity: .96; animation: none !important; } .photo-drop.left { top: 10%; transform: none; } .photo-drop.right { top: 58%; transform: none; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <span class="spark" aria-hidden="true">✦</span><span class="spark" aria-hidden="true">✧</span><span class="spark" aria-hidden="true">♥</span><span class="spark" aria-hidden="true">♡</span><span class="spark" aria-hidden="true">♥</span><span class="spark" aria-hidden="true">✧</span><span class="spark" aria-hidden="true">♡</span>
  <div class="love-trail" aria-hidden="true">
    <div class="photo-drop left"><div class="photo-card"><img src="foto-santi-1.jpg" alt="" /><span class="love-word">te amo</span><span class="love-heart one">♥</span><span class="love-heart two">♡</span><span class="love-heart three">♥</span></div></div>
    <div class="photo-drop right"><div class="photo-card"><img src="foto-santi-2.jpg" alt="" /><span class="love-word">te amo</span><span class="love-heart one">♡</span><span class="love-heart two">♥</span><span class="love-heart three">♡</span></div></div>
  </div>
  <main>
    <article class="letter" aria-labelledby="title">
      <span class="ornament ornament-left" aria-hidden="true">♡</span>
      <span class="ornament ornament-right" aria-hidden="true">♥</span>
      <p class="eyebrow">una página para mi persona favorita</p>
      <h1 id="title">Para vos, <span>Santi</span></h1>
      <div class="rule" aria-hidden="true">✧</div>
      <p class="message" aria-label="Santi, te amo más de lo que caben las estrellas. Con vos, cada día es infinito como mi amor por vos."><span id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
      <p class="counter"><b>21</b> palabras · todo mi corazón</p>
      <div class="duo" aria-label="Un corazón y el monito meme">
        <div class="heart-wrap" aria-hidden="true"><span class="heart">♥</span></div>
        <figure>
          <div class="meme-frame"><img src="https://stat.ameba.jp/user_images/20260225/13/yokonew89/9b/67/j/o1080142915754734617.jpg" alt="Punch abrazando su peluche de monito" /></div>
          <figcaption>vos mi amorsito</figcaption>
        </figure>
      </div>
      <p class="credit">Te amo +∞ más que lo que vos digas</p>
    </article>
  </main>
  <script>
    const message = 'Santi, te amo más de lo que caben las estrellas. Con vos, cada día es infinito como mi amor por vos.';
    const target = document.getElementById('typed');
    let index = 0;
    const typeNext = () => {
      if (index < message.length) {
        target.textContent += message[index++];
        window.setTimeout(typeNext, message[index - 1] === ',' || message[index - 1] === '.' || message[index - 1] === ';' ? 300 : 43);
      }
    };
    window.setTimeout(typeNext, 650);
  </script>
</body>
</html>
